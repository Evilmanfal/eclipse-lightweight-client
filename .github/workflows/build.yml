name: Build

# Every push to main (and every pull request) compiles, tests and uploads Eclipse.exe as a
# downloadable artifact. Pushing a tag like v0.8.1 also publishes it as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Puts rc.exe (Windows resource compiler, used by build.rs for the icon) on PATH.
      - uses: ilammy/msvc-dev-cmd@v1

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/eclipse-native.exe Eclipse.exe
          $hash = (Get-FileHash Eclipse.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Eclipse.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Eclipse-${{ github.sha }}
          path: |
            Eclipse.exe
            SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "Eclipse.exe#Eclipse.exe (Windows x64)" SHA256SUMS.txt --clobber
          } else {
            gh release create $tag "Eclipse.exe#Eclipse.exe (Windows x64)" SHA256SUMS.txt --title "Eclipse $tag" --generate-notes
          }
